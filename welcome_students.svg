      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.3"/>
    </g>
    <!-- 2 -->
    <g transform="translate(165, 130)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.75"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.3"/>
    </g>
    <!-- 3 -->
    <g transform="translate(200, 130)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.75"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.3"/>
    </g>
    <!-- 4 -->
    <g transform="translate(235, 130)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.75"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.3"/>
    </g>
    <!-- 5 -->
    <g transform="translate(270, 130)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.75"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.3"/>
    </g>
    <!-- Row 2: 5 figures -->
    <!-- 6 -->
    <g transform="translate(147, 168)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.6"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.22"/>
    </g>
    <!-- 7 -->
    <g transform="translate(182, 168)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.6"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.22"/>
    </g>
    <!-- 8 -->
    <g transform="translate(217, 168)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.6"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.22"/>
    </g>
    <!-- 9 -->
    <g transform="translate(252, 168)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.6"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.22"/>
    </g>
    <!-- 10 -->
    <g transform="translate(287, 168)">
      <circle cx="0" cy="-18" r="6" fill="#c8a971" opacity="0.6"/>
      <path d="M-5,-11 Q-7,5 -6,16 Q0,19 6,16 Q7,5 5,-11" fill="#c8a971" opacity="0.22"/>
