<svg viewBox="0 0 520 293" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f36"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a971" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8a971" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="520" height="293" fill="url(#bg2)"/>

  <!-- Background glow -->
  <ellipse cx="260" cy="146" rx="180" ry="130" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#c8a971" stroke-width="0.5">
    <line x1="0" y1="73" x2="520" y2="73"/>
    <line x1="0" y1="146" x2="520" y2="146"/>
    <line x1="0" y1="220" x2="520" y2="220"/>
    <line x1="130" y1="0" x2="130" y2="293"/>
    <line x1="260" y1="0" x2="260" y2="293"/>
    <line x1="390" y1="0" x2="390" y2="293"/>
  </g>

  <!-- Stars / sparks scattered -->
  <g fill="#c8a971">
    <circle cx="80" cy="55" r="1.2" opacity="0.5"/>
    <circle cx="155" cy="38" r="0.8" opacity="0.4"/>
    <circle cx="320" cy="45" r="1" opacity="0.6"/>
    <circle cx="420" cy="62" r="1.3" opacity="0.4"/>
    <circle cx="460" cy="35" r="0.9" opacity="0.5"/>
    <circle cx="50" cy="180" r="1" opacity="0.35"/>
    <circle cx="475" cy="200" r="1.2" opacity="0.4"/>
    <circle cx="100" cy="230" r="0.8" opacity="0.3"/>
    <circle cx="440" cy="240" r="1" opacity="0.35"/>
