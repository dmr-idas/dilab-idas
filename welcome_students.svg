  <!-- Number 10 large, right side -->
  <text x="395" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#c8a971" opacity="0.08" font-weight="bold">10</text>
  <text x="395" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c8a971" opacity="0.35" letter-spacing="2">NEW RESEARCHERS</text>

  <!-- Decorative mortarboard / academic cap hint -->
  <g transform="translate(390, 100)" opacity="0.5">
    <rect x="-18" y="-3" width="36" height="5" rx="1" fill="#c8a971" opacity="0.6"/>
    <polygon points="0,-15 -20,-3 0,3 20,-3" fill="#c8a971" opacity="0.4"/>
    <line x1="18" y1="-1" x2="24" y2="10" stroke="#c8a971" stroke-width="1.5" opacity="0.5"/>
    <circle cx="24" cy="12" r="2.5" fill="#c8a971" opacity="0.5"/>
  </g>

  <!-- Welcome text -->
  <text x="260" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c8a971" letter-spacing="3" opacity="0.95">WELCOME</text>
  <text x="260" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" fill="#c8a971" opacity="0.55" letter-spacing="1.5">CLASS OF 2026 · DESIGN INTELLIGENCE LAB</text>

  <!-- Decorative lines -->
  <line x1="60" y1="208" x2="170" y2="208" stroke="#c8a971" stroke-width="0.5" opacity="0.25"/>
  <line x1="350" y1="208" x2="460" y2="208" stroke="#c8a971" stroke-width="0.5" opacity="0.25"/>

  <!-- Small diamond decorations -->
  <polygon points="260,74 263,77 260,80 257,77" fill="#c8a971" opacity="0.4"/>
  <polygon points="260,78 262,80 260,82 258,80" fill="none" stroke="#c8a971" stroke-width="0.5" opacity="0.3"/>
